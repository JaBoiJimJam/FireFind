# Column mappings for normalising firewall exports.
#
# The project now focuses on a generic firewall schema while still allowing
# integrators to extend this file with vendor-specific sections if required.
generic:
  rule_id: ["Seq #", "ID", "Rule ID", "Policy ID", "Policyid", "policyid"]
  src: ["Source Value", "Source", "Address", "Source Address", "srcaddr", "src"]
  dst: ["Destination Value", "Destination", "Address.1", "Destination Address", "dstaddr", "dst"]
  proto: ["Service", "Proto", "Protocol"]
  port: ["Service.1", "Service Port", "Port", "Ports", "DPort"]
  action: ["Action"]
  comment: ["Comments", "Comment", "Name", "Remarks", "comments"]
  service: ["Service", "service"]
  srcintf: ["Srcintf", "Source Interface", "src_interface", "srcintf"]
  dstintf: ["Dstintf", "Destination Interface", "dst_interface", "dstintf"]
  hit_count: ["Hit Count", "Hits", "Log Count", "HitCount"]
  byte_count: ["Bytes", "Byte Count", "Traffic (Bytes)", "ByteCount"]
  enabled: ["Enabled", "State", "Status", "Active", "Rule Status"]
  tags:
    columns:
      - ["Functional Category", "Function", "Category"]
      - ["Tags", "Tag"]
    separators: [",", ";", "|"]
    defaults: ["firewall-rule"]
    mapping:
      remote access: ["remote-access"]
      vpn: ["remote-access", "vpn"]
      web management: ["web-management"]
