  - 1026
  - 1433
  - 3268
  - 3269
  - 3389
  - 27000
  - 7279
  - 8810
  - 8811
  - 49152
  - 65435
  - 65535
critical_risk_admin_ports:
  - 21
  - 135
  - 137
  - 138
  - 139
  - 514
  - 1024
  - 1025
  - 1026
  - 27000
  - 7279
  - 49152
  - 65435
  - 65535
