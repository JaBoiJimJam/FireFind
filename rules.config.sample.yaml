# FireFind rules configuration sample demonstrating advanced schema features.
#
# Copy this file to ``rules/rules.yaml`` or pass the path via ``--rules`` when running
# the CLI. Omitted sections automatically fall back to FireFind's built-in defaults.

# ---------------------------------------------------------------------------
# Administrative port tuning
# ---------------------------------------------------------------------------
admin_ports: &baseline_admin_ports
  # Baseline ports considered administrative across all vendors.
  - 22    # SSH
  - 443   # HTTPS management
  - 3389  # RDP

critical_risk_admin_ports: &critical_admin_ports
  - 22
  - 443

high_risk_admin_ports: &high_admin_ports
  - 3389
  - 5900

medium_risk_admin_ports: &medium_admin_ports
  - 389
  - 636

low_risk_admin_ports: &low_admin_ports
  - 25

# ---------------------------------------------------------------------------
# Risk level definitions enrich findings with remediation context.  Each entry
# includes human-friendly labels, numeric thresholds, and rationale metadata.
# ---------------------------------------------------------------------------
risk_levels:
  critical:
    label: "Critical Risk"
    severity: critical
    thresholds:
      min_score: 90
      min_findings: 1
    rationale:
      summary: "Exposure that enables immediate compromise."
      details: |
        Findings tagged as "Critical" should be escalated to the incident
        response process and tracked at the executive level until resolved.
      references:
        - "NIST SP 800-30 Rev.1"
        - "MITRE ATT&CK Initial Access"
  high:
    label: "High Risk"
    severity: high
    thresholds:
      min_score: 70
    rationale:
      summary: "Severe exposure requiring near-term remediation."
      references:
        - "CIS Critical Security Controls"
  medium:
    label: "Medium Risk"
    severity: medium
    thresholds:
      min_score: 40
    rationale:
      summary: "Meaningful exposure to address during the next change window."
  cautionary:
    label: "Cautionary Risk"
    severity: cautionary
    thresholds:
      min_score: 25
    rationale:
      summary: "Monitor the condition and schedule remediation before the next audit."
  low:
    label: "Low Risk"
    severity: low
    thresholds:
      min_score: 0
    rationale:
      summary: "Informational hygiene opportunities."

# ---------------------------------------------------------------------------
# CIDR limit sets provide analyzer-aware network scope controls.  Policies can
# be overridden per vendor, traffic direction, or both.
# ---------------------------------------------------------------------------
cidr_limits:
  broad_networks:
    default:
      max_prefix: 8
      blocked:
        - "0.0.0.0/0"
        - "::/0"
      description: "Flag networks wider than /8 as excessively broad."
    analyzers:
      admin_port_exposed:
        max_prefix: 12
        description: "Allow slightly broader ranges when focusing on admin ports."
    directions:
      outbound:
        max_prefix: 12
        description: "Outbound policies can be marginally broader."

# ---------------------------------------------------------------------------
# Reusable port groups eliminate duplication across analyzers.  Entries accept
# single ports or inclusive ranges and are validated to prevent overlap.
# ---------------------------------------------------------------------------
port_groups:
  core_admin:
    description: "Core administrative surfaces exposed to management tooling."
    protocol: tcp
    ranges:
      - 22
      - 80
      - 443
      - 3389
  directory_services:
    description: "Directory and authentication infrastructure ports."
    protocol: tcp
    ranges:
      - 389
      - 636
  legacy_management:
    description: "Legacy protocols retained for specific workflows."
    protocol: tcp
    ranges:
      - 23
      - 515
      - 1024-1026
      - 2303
      - 27000

# ---------------------------------------------------------------------------
# Rule definitions describe how analyzers evaluate traffic.  Each entry
# enumerates the base rule metadata, structured condition groups, and the
# analyzer-specific overrides that tune severity and administrative port tiers.
# ---------------------------------------------------------------------------
rules:
  admin_port_exposed:
    id: "admin_port_exposed"
    label: "Administrative Port Exposure"
    description: >-
      Flags allow policies that expose administrative services to untrusted
      destinations. Severity tiers inherit from the configured admin port sets
      so that tuning a single list updates both matching and reporting logic.
    conditions:
      logic: all
      conditions:
        - field: action
          comparator: equals
          value: allow
      groups:
        - logic: any
          conditions:
            - field: service
              comparator: matches_port_group
              values:
                - core_admin
                - directory_services
                - legacy_management
            - field: port
              comparator: matches_admin_port
    analyzers:
      admin_port_exposed:
        enabled: true
        notes: |
          Analyzer outputs inherit severity overrides for each admin port tier
          and leverage reusable port groups to minimise duplication.
        severity_overrides:
          critical: critical
          high: high
          medium: medium
          low: low
        admin_ports:
          baseline: *baseline_admin_ports
          per_risk_overrides:
            critical: *critical_admin_ports
            high: *high_admin_ports
            medium: *medium_admin_ports
            low: *low_admin_ports

# ---------------------------------------------------------------------------
# Backwards compatibility: existing keys like ``broad_cidr_prefix_max`` remain
# valid for older configurations and are merged with the new schema.
# ---------------------------------------------------------------------------
broad_cidr_prefix_max: 8