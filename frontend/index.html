<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireFind</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="show-scan-line">
    <div class="bg-animation">
        <div class="cyber-grid"></div>
    </div>

    <div class="scan-line"></div>

    <header id="header">
        <nav>
            <div class="logo">
                <img src="firefind-logo.png" alt="FireFind" class="logo-img" style="height: auto !important; width: 180px !important; max-width: 200px !important; min-width: 160px !important;">
            </div>
            <ul class="nav-links">
                <li><a href="index.html" onclick="handleAboutClick(event)">About</a></li>
                <li><a href="scan.html">Scan</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to FireFind</h1>
            <p class="hero-description">
                FireFind analyses firewall configurations across multiple vendors to highlight risky rules,
                exposed admin services, and compliance issues before they become incidents.
            </p>
        </div>
    </section>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>

    <footer>
        <p>&copy; 2025 FireFind by Team Five Guys | Triskele Labs</p>
    </footer>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.location.pathname.includes('index.html') || window.location.pathname === '/') {
                history.replaceState({ file: 'index.html' }, 'About - FireFind', '/about');
            }

            setTimeout(function() {
                const navLinks = document.querySelectorAll('.nav-links a');
                navLinks.forEach(link => link.classList.remove('active'));
                const aboutLink = document.querySelector('.nav-links a[href="index.html"]');
                if (aboutLink) {
                    aboutLink.classList.add('active');
                }
            }, 100);
        });
    </script>
</body>
</html>
